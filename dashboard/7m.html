<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HU Dashboard</title>
  <meta name="description" content="Ranges">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
</head>

<body>
  <center>
    <img src="./images/coinpoker_500NL/BTN_vs_BB_p1.png" id="image_1"><br/>
    <img src="./images/coinpoker_500NL/BTN_vs_BB_p2.png" id="image_2">
  </center>

  <center>
    <br/>

    <!-- NEW: Dataset toggle (expandable) -->
    <div id="dataset_toggle" class="dataset-toggle"></div>

    <br/>

    <!-- Positions -->
    <button class="btn btn-danger p1b" onclick="selectP1Button('UTG')">UTG</button>
    <button class="btn btn-danger p1b" onclick="selectP1Button('LJ')">LJ</button>
    <button class="btn btn-danger p1b" onclick="selectP1Button('HJ')">HJ</button>
    <button class="btn btn-danger p1b" onclick="selectP1Button('CO')">CO</button>
    <button class="btn btn-danger p1b" onclick="selectP1Button('BTN')">BTN</button>
    <button class="btn btn-danger p1b" onclick="selectP1Button('SB')">SB</button>
    <button class="btn btn-secondary">__</button>
    <br/><br/>

    <button class="btn btn-secondary">__</button>
    <button class="btn btn-info p2b" onclick="selectP2Button('LJ')">LJ</button>
    <button class="btn btn-info p2b" onclick="selectP2Button('HJ')">HJ</button>
    <button class="btn btn-info p2b" onclick="selectP2Button('CO')">CO</button>
    <button class="btn btn-info p2b" onclick="selectP2Button('BTN')">BTN</button>
    <button class="btn btn-info p2b" onclick="selectP2Button('SB')">SB</button>
    <button class="btn btn-info p2b" onclick="selectP2Button('BB')">BB</button>
  </center>

  <br/>
  <span class="parent">
    <center>
      <button onclick="generateRandomNumber()" class="button" id="result">0</button>

      <!-- sizing schema box -->
      <div id="schema_box" class="schema-box"></div>

      <div id="bar"></div>
    </center>
  </span>

  <script>
    // NEW: Expandable dataset config
    // Add more sets by appending entries here.
    const DATASETS = [
      { id: "rfi_25", label: "2.5BB RFI", directory: "coinpoker_500NL" },
      { id: "rfi_20", label: "2BB RFI",  directory: "coinpoker_500NL_small_RFI" },
    ];

    let ACTIVE_DATASET_ID = DATASETS[0].id;

    const POS_ORDER = ["UTG", "LJ", "HJ", "CO", "BTN", "SB", "BB"];

    const SIZING_SCHEMA = {
      "UTG_vs_LJ": ["2.5", "9", "23"],
      "UTG_vs_HJ": ["2.5", "9", "23"],
      "UTG_vs_CO": ["2.5", "9.5", "24"],
      "UTG_vs_BTN": ["2.5", "10", "25.5"],
      "UTG_vs_SB": ["2.5", "11.5", "23"],
      "UTG_vs_BB": ["2.5", "12", "24"],

      "LJ_vs_HJ": ["2.5", "9", "23"],
      "LJ_vs_CO": ["2.5", "9.5", "24"],
      "LJ_vs_BTN": ["2.5", "10", "25.5"],
      "LJ_vs_SB": ["2.5", "11.5", "23"],
      "LJ_vs_BB": ["2.5", "12", "24"],

      "HJ_vs_CO": ["2.5", "9.5", "25"],
      "HJ_vs_BTN": ["2.5", "10", "25.5"],
      "HJ_vs_SB": ["2.5", "12", "24"],
      "HJ_vs_BB": ["2.5", "13", "26"],

      "CO_vs_BTN": ["2.4", "10", "25.5"],
      "CO_vs_SB": ["2.5", "12", "24"],
      "CO_vs_BB": ["2.5", "13", "26"],

      "BTN_vs_SB": ["2.5", "11", "22"],
      "BTN_vs_BB": ["2.5", "14", "28"],

      "SB_vs_BB": ["3.5", "10.5", "21"],
    };

    function getActiveDataset() {
      return DATASETS.find(d => d.id === ACTIVE_DATASET_ID) || DATASETS[0];
    }

    // NEW: render dataset toggle UI
    function renderDatasetToggle() {
      const root = document.getElementById("dataset_toggle");
      if (!root) return;

      const itemsHtml = DATASETS.map((d, idx) => {
        const checked = d.id === ACTIVE_DATASET_ID ? "checked" : "";
        return `
          <label class="dataset-option">
            <input type="radio" name="dataset" value="${d.id}" ${checked}
              onchange="setActiveDataset('${d.id}')">
            <span>${d.label}</span>
          </label>
        `;
      }).join("");

      root.innerHTML = `<div class="dataset-title">Dataset</div><div class="dataset-options">${itemsHtml}</div>`;
    }

    // NEW: change dataset + refresh images
    function setActiveDataset(datasetId) {
      ACTIVE_DATASET_ID = datasetId;
      setImages();
    }

    function getSelectedPlayer(pClass) {
      var elements = document.getElementsByClassName(pClass);
      for (let i = 0; i < elements.length; i++) {
        if (elements[i].classList.contains("selected")) {
          return elements[i].innerHTML;
        }
      }
      return '';
    }

    function isValidPlayerCombo(player1, player2) {
      if (!player1 || !player2) return false;
      if (player1 === player2) return false;

      const i1 = POS_ORDER.indexOf(player1);
      const i2 = POS_ORDER.indexOf(player2);
      if (i1 === -1 || i2 === -1) return false;

      return i2 > i1;
    }

    function selectP1Button(p1Position) {
      var elements = document.getElementsByClassName("p1b");
      for (let i = 0; i < elements.length; i++) {
        var element = elements[i];
        if (element.innerHTML === p1Position) {
          element.classList.remove("btn-danger");
          element.classList.add("btn-warning");
          element.classList.add("selected");
        } else {
          element.classList.remove("btn-warning");
          element.classList.remove("selected");
          element.classList.add("btn-danger");
        }
      }

      var p2 = getSelectedPlayer("p2b");
      if (!isValidPlayerCombo(p1Position, p2)) {
        const i1 = POS_ORDER.indexOf(p1Position);
        const fallbackP2 = POS_ORDER[i1 + 1] || "BB";
        selectP2Button(fallbackP2);
      }

      setImages();
    }

    function selectP2Button(p2Position) {
      var p1 = getSelectedPlayer("p1b");
      if (!isValidPlayerCombo(p1, p2Position)) {
        return;
      }

      var elements = document.getElementsByClassName("p2b");
      for (let i = 0; i < elements.length; i++) {
        var element = elements[i];
        if (element.innerHTML === p2Position) {
          element.classList.remove("btn-info");
          element.classList.add("btn-warning");
          element.classList.add("selected");
        } else {
          element.classList.remove("btn-warning");
          element.classList.remove("selected");
          element.classList.add("btn-info");
        }
      }

      setImages();
    }

    function updateSchemaBox(p1, p2) {
      const box = document.getElementById("schema_box");
      if (!box) return;

      const key = `${p1}_vs_${p2}`;
      const vals = SIZING_SCHEMA[key];

      if (!p1 || !p2) {
        box.innerHTML = "";
        return;
      }

      if (!vals) {
        box.innerHTML = `<div><strong>${p1} vs ${p2}</strong></div><div>(no sizing schema found)</div>`;
        return;
      }

      box.innerHTML =
        `<div><strong>${p1} vs ${p2}</strong></div>` +
        `<div>${vals[0]} / ${vals[1]} / ${vals[2]}</div>`;
    }

    function setImages() {
      var p1 = getSelectedPlayer("p1b");
      var p2 = getSelectedPlayer("p2b");
      if (!p1 || !p2) return;

      const dataset = getActiveDataset();
      const directory = dataset.directory;

      var path1 = `./images/${directory}/${p1}_vs_${p2}_p1.png`;
      var path2 = `./images/${directory}/${p1}_vs_${p2}_p2.png`;

      var elem1 = document.getElementById("image_1");
      var elem2 = document.getElementById("image_2");
      elem1.src = path1;
      elem2.src = path2;

      updateSchemaBox(p1, p2);
    }

    function generateRandomNumber() {
      var elem = document.getElementById("result");
      var chosenNumber = Math.round(Math.random() * 99);
      elem.innerHTML = chosenNumber;

      if (chosenNumber <= 10) {
        elem.style.backgroundColor = "#37e3ff";
      } else if (chosenNumber <= 20) {
        elem.style.backgroundColor = "#58c4db";
      } else if (chosenNumber <= 30) {
        elem.style.backgroundColor = "#62bbd1";
      } else if (chosenNumber <= 40) {
        elem.style.backgroundColor = "#73abbe";
      } else if (chosenNumber <= 50) {
        elem.style.backgroundColor = "#839cad";
      } else if (chosenNumber <= 60) {
        elem.style.backgroundColor = "#958c9a";
      } else if (chosenNumber <= 70) {
        elem.style.backgroundColor = "#ad7681";
      } else if (chosenNumber <= 80) {
        elem.style.backgroundColor = "#bb6972";
      } else if (chosenNumber <= 90) {
        elem.style.backgroundColor = "#d1555b";
      } else {
        elem.style.backgroundColor = "#e54346";
      }
    }

    // Defaults
    renderDatasetToggle();
    selectP1Button("BTN");
    selectP2Button("BB");
    setImages();
  </script>

  <style>
    .btn {
      padding-top: 2px;
      padding-bottom: 2px;
    }

    #image_1, #image_2 {
      width: 80%;
    }

    .button {
      display: block;
      width: 100%;
      height: 80px;
      border: none;
      background-color: #37e3ff;
      padding: 14px 28px;
      font-size: 45px;
      cursor: pointer;
      text-align: center;
    }

    .schema-box {
      margin-top: 8px;
      width: 100%;
      max-width: 520px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 16px;
      background: #fafafa;
    }

    /* NEW: dataset toggle styling */
    .dataset-toggle {
      display: inline-block;
      width: 100%;
      max-width: 520px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      text-align: left;
    }

    .dataset-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .dataset-options {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .dataset-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      cursor: pointer;
      margin: 0;
    }

    .parent {
      width: 100%;
      height: 100%;
    }

    .bar-elem {
      padding: 10px;
      width: 10px;
      height: 10px;
      border: 10px;
    }
  </style>
</body>
</html>
